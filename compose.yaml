services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: MINIPROJECT
      POSTGRES_USER: hyfuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyfuser -d MINIPROJECT"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8082:8081"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev,docker
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: